
name: Build RafiqRemote APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake automake

      - name: Install Buildozer
        run: |
          pip install --user buildozer cython==0.29.33

      - name: Accept Android SDK License
        run: |
          if grep -q '^android.accept_sdk_license' buildozer.spec; then
            sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          else
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          fi

      - name: Build APK
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RafiqRemote-APK
          path: bin/*.apk
